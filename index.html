    <!-- ═══════════════════════════════════════════════════════════════════
         BASE STYLES
         ─────────────────────────────────────────────────────────────────── -->
    <style media="all">
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        -webkit-font-smoothing: auto;
      }

      * {
        padding: 0;
        margin: 0;
      }
      a {
        color: inherit;
        text-decoration: inherit;
      }
      input {
        border: none;
        font: inherit;
        outline: none;
        background-color: inherit;
      }
      button {
        border-style: none;
        width: auto;
        overflow: visible;
        background: transparent;
        font: inherit;
        line-height: normal;
        color: inherit;
      }
      textarea {
        font: inherit;
        background-color: inherit;
      }
      select {
        font: inherit;
        background-color: inherit;
      }
      img {
        display: block;
      }
      picture {
        display: block;
      }
      video {
        display: block;
      }
      canvas {
        display: block;
      }
      svg {
        display: block;
      }

      [data-visible='false'] {
        display: none !important;
      }

      .before-hidden::before {
        display: none;
      }

      .after-hidden::after {
        display: none;
      }

      .before-visible::before {
        content: '';
      }

      .after-visible::after {
        content: '';
      }

      .text {
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }

      html {
        overflow-x: hidden;
      }

      body {
        background-color: #f9fdfc;
        overflow-x: hidden;
        margin: 0;
        padding: 0;
      }

      .page-viewport {
        width: 100%;
        overflow-x: hidden;
      }

      .page-content {
        width: 100%;
        margin: 0;
        position: relative;
        transform-origin: top left;
        will-change: transform;
      }

      /* Hide Figma component / artboard frames outside the main page */
      .figma-artifacts {
        display: none !important;
        height: 0 !important;
        overflow: hidden !important;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      .page-viewport {
        overflow: visible;
      }

      .page-content {
        transform-origin: top left;
      }

      /* ─────────────────────────────────────────────────────────────────
   HERO SECTION — fluid sizing so it scales down instead of
   overflowing horizontally on small screens
   ───────────────────────────────────────────────────────────────── */

      .hero-section {
        width: 100%;
        height: 870px;
        position: relative;
        flex-shrink: 0;
      }

      .hero-carousel {
        width: 100%;
        height: 704px;
        overflow: hidden;
        position: relative;
      }

      .hero-carousel-track {
        display: flex;
        height: 100%;
        transition: transform 0.6s ease;
        will-change: transform;
      }

      .hero-slide {
        width: 100%;
        min-width: 100%;
        height: 704px;
        flex-shrink: 0;
        position: relative;
        overflow: hidden;
      }

      .hero-features-bar {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 166px;
        background-color: #194332;
        overflow: hidden;
        z-index: 10;
      }

      .hero-carousel-dots {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        z-index: 20;
      }

      .hero-carousel-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: none;
        padding: 0;
        cursor: pointer;
        background-color: rgba(255, 255, 255, 0.4);
        transition:
          background-color 0.3s ease,
          transform 0.3s ease;
      }

      .hero-carousel-dot.is-active {
        background-color: #d3a014;
        transform: scale(1.15);
      }

      /* ─────────────────────────────────────────────────────────────────
   RESPONSIVE BREAKPOINTS
   Tablet: ≤1024px · Mobile: ≤768px · Small phones: ≤480px
   The features bar switches from a horizontal row to a scrollable
   / stacked layout on small screens since 166px isn't enough height
   for wrapped 3–4 column content at narrow widths — adjust the
   height values below to match your actual feature-bar content.
   ───────────────────────────────────────────────────────────────── */

      @media (max-width: 1024px) {
        .hero-section {
          height: 760px;
        }
        .hero-carousel,
        .hero-slide {
          height: 600px;
        }
        .hero-features-bar {
          height: 150px;
        }
      }

      @media (max-width: 768px) {
        .hero-section {
          height: auto;
          min-height: 620px;
        }
        .hero-carousel,
        .hero-slide {
          height: 480px;
        }
        .hero-features-bar {
          position: static;
          height: auto;
          min-height: 166px;
          padding: 16px 12px;
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 12px;
        }
        .hero-carousel-dots {
          bottom: 16px;
        }
      }

      @media (max-width: 480px) {
        .hero-carousel,
        .hero-slide {
          height: 380px;
        }
        .hero-features-bar {
          flex-direction: column;
          align-items: center;
          padding: 14px 10px;
        }
        .hero-carousel-dot {
          width: 8px;
          height: 8px;
        }
      }
    </style>
